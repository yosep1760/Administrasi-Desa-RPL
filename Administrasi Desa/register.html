<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - NamaWeb</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============================================
       HALAMAN REGISTER / DAFTAR AKUN
       Tampilan dua panel: form register (kiri) + sambutan (kanan)
       ============================================ -->
  <div class="halaman-auth">

    <!-- Dekorasi sudut halaman auth -->
    <div class="auth-dekorasi-1"></div>
    <div class="auth-dekorasi-2"></div>

    <!-- Kartu utama register -->
    <div class="kartu-auth">

      <!-- PANEL KIRI: Form register -->
      <div class="auth-form-panel">
        <h2>Register</h2>

        <!-- Pesan error validasi (tersembunyi secara default) -->
        <div id="pesanErrorReg" class="alert alert-bahaya" style="display:none;"></div>

        <!-- Form pendaftaran akun baru -->
        <form onsubmit="validasiRegister(event)">

          <!-- Input Username -->
          <div class="grup-input">
            <label for="regUsername">Username</label>
            <input
              type="text"
              id="regUsername"
              class="input-teks"
              placeholder="Buat username Anda"
              required
              autocomplete="username"
            />
          </div>

          <!-- Input Email -->
          <div class="grup-input">
            <label for="regEmail">Email</label>
            <input
              type="email"
              id="regEmail"
              class="input-teks"
              placeholder="Masukkan email aktif Anda"
              required
              autocomplete="email"
            />
          </div>

          <!-- Input Password -->
          <div class="grup-input">
            <label for="regPassword">Password</label>
            <input
              type="password"
              id="regPassword"
              class="input-teks"
              placeholder="Minimal 6 karakter"
              required
              autocomplete="new-password"
            />
          </div>

          <!-- Tombol submit register -->
          <div style="margin-top:1.25rem;">
            <button type="submit" class="btn-primer" style="width:100%;">Register</button>
          </div>

        </form>

        <!-- Link ke halaman login jika sudah punya akun -->
        <div class="auth-link">
          Sudah punya akun? <a href="login.html">Sign Up</a>
        </div>

        <!-- Link kembali ke beranda -->
        <div class="auth-link" style="margin-top:0.5rem;">
          <a href="index.html" style="color:var(--warna-teks-muda);">← Kembali ke Beranda</a>
        </div>
      </div>

      <!-- PANEL KANAN: Pesan sambutan -->
      <div class="auth-sambutan-panel">
        <h3>Welcome<br />Back!</h3>
        <p>
          We're delighted to have you here.
          If you need any assistance, feel free to reach out.
        </p>
      </div>

    </div>
  </div>

  <!-- Load JavaScript utama -->
  <script src="js/main.js"></script>
</body>
</html>
